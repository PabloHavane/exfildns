# Déploiement d'exfildns : capture DNS en direct + dashboard de supervision.
#   cp .env.example .env    # puis choisir l'interface à surveiller
#   docker compose up -d --build
#   -> dashboard sur http://localhost:8501
# Prérequis : le modèle entraîné dans ./models/exfildns.keras (exfildns train ou le notebook).

x-commun: &commun
  image: exfildns:local
  # Même uid que l'utilisateur de l'image : filet de sécurité si l'image changeait
  user: "10001"
  read_only: true
  # Heures affichées dans le fuseau local (le conteneur est en UTC par défaut)
  environment:
    TZ: ${TZ:-Europe/Paris}
  tmpfs:
    - /tmp
  restart: unless-stopped

services:
  sniff:
    <<: *commun
    build: .  # une seule construction : le dashboard réutilise l'image exfildns:local
    # Réseau de l'hôte : voir et analyser le trafic DNS de la machine
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    # Pas de no-new-privileges ici : il annulerait la capacité de fichier de python-capture
    entrypoint: ["python-capture", "-m", "exfildns.cli"]
    command:
      - sniff
      - --interface
      - ${EXFILDNS_INTERFACE:?définir EXFILDNS_INTERFACE dans .env (voir .env.example)}
      - --base
      - /data/detections.db
      - --modele
      - /models/exfildns.keras
      - --retention
      - ${EXFILDNS_RETENTION:-30}
    volumes:
      - ./models:/models:ro
      - detections:/data

  dashboard:
    <<: *commun
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Mot de passe demandé à l'ouverture du dashboard ; vide : accès libre
      EXFILDNS_MOT_DE_PASSE: ${EXFILDNS_MOT_DE_PASSE:-}
    command:
      - dashboard
      - --base
      - /data/detections.db
      - --modele
      - /models/exfildns.keras
      - --adresse
      - 0.0.0.0
      # statuts des alertes : seule base écrite par le dashboard, detections.db reste en :ro
      - --statuts
      - /etat/statuts.db
    # Publié sur l'hôte en local seulement : le dashboard affiche les noms demandés et les postes
    ports:
      - "127.0.0.1:${EXFILDNS_PORT:-8501}:8501"
    volumes:
      - ./models:/models:ro
      - detections:/data:ro
      - statuts:/etat
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 30s
      timeout: 5s
      retries: 3

  # Notification des alertes hautes par webhook, facultative :
  #   docker compose --profile notification up -d    (EXFILDNS_WEBHOOK dans .env)
  notifier:
    <<: *commun
    profiles: [notification]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Variable plutôt qu'argument : l'adresse contient souvent un jeton, absent de `ps`
      # vide : le service s'arrête avec « Adresse du webhook manquante » (docker compose logs)
      EXFILDNS_WEBHOOK: ${EXFILDNS_WEBHOOK:-}
    command:
      - notifier
      - --base
      - /data/detections.db
      - --statuts
      - /etat/statuts.db
    # Lecture seule des deux bases : mêmes alertes, statuts et liste blanche que le dashboard
    volumes:
      - detections:/data:ro
      - statuts:/etat:ro

volumes:
  detections:
  statuts:
