name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatage
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
