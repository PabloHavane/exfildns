name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatage
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  # Seule la branche main peut être mergée vers production (check obligatoire sur production).
  source-production:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "production" ] && [ "$HEAD" != "main" ]; then
            echo "Seule main peut être mergée vers production (source : $HEAD)."
            exit 1
          fi
