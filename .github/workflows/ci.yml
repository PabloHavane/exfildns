name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python et les dépendances
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatage
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  # Image Docker : lint, validation du compose, construction et démarrage
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint du Dockerfile du mini-labo
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: labo/Dockerfile
      - name: Validation de compose.yaml et compose.labo.yaml
        run: |
          EXFILDNS_INTERFACE=eth0 docker compose config -q
          docker compose -f compose.labo.yaml config -q
      - name: Construction de l'image
        run: docker build -t exfildns:ci .
      - name: L'image démarre, sans root
        run: |
          docker run --rm exfildns:ci --version
          test "$(docker run --rm --entrypoint id exfildns:ci -u)" = "10001"

  # Seule la branche main peut être mergée vers production (check obligatoire sur production).
  source-production:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la branche source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "production" ] && [ "$HEAD" != "main" ]; then
            echo "Seule main peut être mergée vers production (source : $HEAD)."
            exit 1
          fi
