[project]
name = "exfildns"
version = "2.2.1"
description = "Détection par machine learning des requêtes DNS servant à l'exfiltration de données"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scapy>=2.6",
    "scikit-learn>=1.5",
    "streamlit>=1.67.0",
    # roue CPU seule sous Linux x86_64 (image Docker plus légère), tensorflow complet ailleurs
    "tensorflow-cpu>=2.21.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorflow>=2.21.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.scripts]
exfildns = "exfildns.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
notebook = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
