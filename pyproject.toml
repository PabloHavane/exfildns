[project]
name = "exfildns"
version = "1.0.0"
description = "Détection par machine learning des requêtes DNS servant à l'exfiltration de données"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scapy>=2.6",
    "scikit-learn>=1.5",
    "tensorflow>=2.21.0",
]

[project.scripts]
exfildns = "exfildns.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
